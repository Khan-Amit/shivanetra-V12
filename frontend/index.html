<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shivanetra V12 – MARDUKH SYSTEM™</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 30% 20%, #0a0f1e, #020408);
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .landing-container {
            max-width: 550px;
            width: 100%;
            background: rgba(10, 14, 23, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            padding: 2.5rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 0 2px #d4af37 inset;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f9e0a0, #c9a52c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #b9a46b;
            margin-bottom: 2rem;
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            color: #e5cb7a;
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid #d4af37;
            background: #1a1f2e;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #f0c45a;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
        }

        .row-3 {
            display: flex;
            gap: 10px;
        }
        .row-3 select {
            flex: 1;
        }

        .enter-btn {
            background: linear-gradient(135deg, #d4af37, #b8912e);
            color: #0a0c16;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 14px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            width: 100%;
            margin-top: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .enter-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }

        .footer-note {
            margin-top: 1.8rem;
            font-size: 0.65rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <div class="logo">⚡ MARDUKH SYSTEM™ ⚡</div>
        <div class="subtitle">Shivanetra V12 · Data-Driven Natal Astrology</div>

        <div class="form-group">
            <label>🌟 Full Name</label>
            <input type="text" id="userName" placeholder="Enter your full name">
        </div>

        <div class="form-group">
            <label>🎂 Birth Date</label>
            <div class="row-3">
                <select id="birthDay">
                    <option value="">Day</option>
                </select>
                <select id="birthMonth">
                    <option value="">Month</option>
                </select>
                <select id="birthYear">
                    <option value="">Year</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>⏰ Birth Time (24hr format)</label>
            <div class="row-3">
                <select id="birthHour">
                    <option value="">Hour</option>
                </select>
                <select id="birthMinute">
                    <option value="">Minute</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>📍 Birth Location</label>
            <input type="text" id="birthLocation" placeholder="City, Country">
        </div>

        <button class="enter-btn" id="enterBtn">🔮 GENERATE MY CHART</button>
        <div class="footer-note">© MARDUKH SYSTEM™ — Sovereign Proprietary License | Seliim Ahmed</div>
    </div>

    <script>
        // Populate dropdowns
        function populateDropdowns() {
            // Days
            const daySelect = document.getElementById('birthDay');
            for(let i = 1; i <= 31; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i;
                daySelect.appendChild(option);
            }
            
            // Months
            const monthSelect = document.getElementById('birthMonth');
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            months.forEach((m, idx) => {
                const option = document.createElement('option');
                option.value = idx + 1;
                option.textContent = m;
                monthSelect.appendChild(option);
            });
            
            // Years (1950-2026)
            const yearSelect = document.getElementById('birthYear');
            for(let i = 1950; i <= 2026; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i;
                yearSelect.appendChild(option);
            }
            
            // Hours (0-23)
            const hourSelect = document.getElementById('birthHour');
            for(let i = 0; i <= 23; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i.toString().padStart(2, '0');
                hourSelect.appendChild(option);
            }
            
            // Minutes (0-59)
            const minuteSelect = document.getElementById('birthMinute');
            for(let i = 0; i <= 59; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = i.toString().padStart(2, '0');
                minuteSelect.appendChild(option);
            }
        }
        
        populateDropdowns();
        
        // Handle enter
        document.getElementById('enterBtn').addEventListener('click', () => {
            const name = document.getElementById('userName').value;
            const day = document.getElementById('birthDay').value;
            const month = document.getElementById('birthMonth').value;
            const year = document.getElementById('birthYear').value;
            const hour = document.getElementById('birthHour').value;
            const minute = document.getElementById('birthMinute').value;
            const location = document.getElementById('birthLocation').value;
            
            if(!name || !day || !month || !year || !hour || !minute || !location) {
                alert('Please fill all fields');
                return;
            }
            
            const userData = {
                name: name,
                birthDate: `${year}-${month}-${day}`,
                birthTime: `${hour}:${minute}:00`,
                location: location,
                timestamp: new Date().toISOString()
            };
            
            // Save to localStorage for persistence
            localStorage.setItem('shivanetra_user_data', JSON.stringify(userData));
            
            // Redirect to main app (will build next)
            alert('Data saved! Main app coming in next file.');
            console.log('User Data:', userData);
        });
    </script>
</body>
</html>
