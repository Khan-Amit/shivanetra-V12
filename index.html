<script>
    // ============================================================
    // PLANETARY CALCULATIONS
    // ============================================================
    
    function getJulianDate() { return (new Date().getTime() / 86400000) + 2440587.5; }
    
    function getPlanetLongitude(planet, jd) {
        const T = (jd - 2451545.0) / 36525.0;
        switch(planet) {
            case 'Sun': return (280.46646 + 36000.76983 * T) % 360;
            case 'Moon': return (218.3165 + 481267.8813 * T) % 360;
            case 'Mars': return (355.433 + 6890.174 * T) % 360;
            case 'Mercury': return (174.941 + 41520.790 * T) % 360;
            case 'Jupiter': return (34.351 + 1092.526 * T) % 360;
            case 'Venus': return (50.416 + 58517.814 * T) % 360;
            case 'Saturn': return (40.589 + 421.256 * T) % 360;
            case 'Rahu': return (125.044522 - 1934.136261 * T) % 360;
            case 'Ketu': return ((125.044522 - 1934.136261 * T) + 180) % 360;
            default: return 0;
        }
    }
    
    function getAscendant(jd, lat, lon) {
        const T = (jd - 2451545.0) / 36525.0;
        let theta0 = 280.46061837 + 360.98564736629 * (jd - 2451545.0);
        theta0 = theta0 % 360;
        const obl = 23.439291 - 0.013004 * T;
        const lngSun = getPlanetLongitude('Sun', jd);
        const raSun = Math.atan2(Math.cos(obl * Math.PI/180) * Math.sin(lngSun * Math.PI/180), Math.cos(lngSun * Math.PI/180)) * 180 / Math.PI;
        let raAdj = raSun < 0 ? raSun + 360 : raSun;
        const lst = (theta0 + lon) % 360;
        const hourAngle = lst - raAdj;
        let asc = Math.atan2(Math.sin(hourAngle * Math.PI/180), Math.cos(hourAngle * Math.PI/180) * Math.sin(obl * Math.PI/180) + Math.tan(lat * Math.PI/180) * Math.sin(obl * Math.PI/180)) * 180 / Math.PI;
        if (asc < 0) asc += 360;
        return asc;
    }
    
    function getHouseFromLongitude(lon, asc) {
        let diff = (lon - asc + 360) % 360;
        return Math.floor(diff / 30) + 1;
    }
    
    function getZodiacSign(deg) {
        const signs = ["Aries ♈", "Taurus ♉", "Gemini ♊", "Cancer ♋", "Leo ♌", "Virgo ♍", "Libra ♎", "Scorpio ♏", "Sagittarius ♐", "Capricorn ♑", "Aquarius ♒", "Pisces ♓"];
        return signs[Math.floor(deg / 30) % 12];
    }
    
    function getZodiacSymbol(deg) {
        const sym = ["♈", "♉", "♊", "♋", "♌", "♍", "♎", "♏", "♐", "♑", "♒", "♓"];
        return sym[Math.floor(deg / 30) % 12];
    }
    
    function getNakshatra(deg) {
        const naks = [
            { name: 'Ashwini', lord: 'Ketu', start: 0, end: 13.3333, deity: 'Ashwini Kumaras' },
            { name: 'Bharani', lord: 'Venus', start: 13.3333, end: 26.6667, deity: 'Yama' },
            { name: 'Krittika', lord: 'Sun', start: 26.6667, end: 40, deity: 'Agni' },
            { name: 'Rohini', lord: 'Moon', start: 40, end: 53.3333, deity: 'Brahma' },
            { name: 'Mrigashira', lord: 'Mars', start: 53.3333, end: 66.6667, deity: 'Soma' },
            { name: 'Ardra', lord: 'Rahu', start: 66.6667, end: 80, deity: 'Shiva' },
            { name: 'Punarvasu', lord: 'Jupiter', start: 80, end: 93.3333, deity: 'Aditi' },
            { name: 'Pushya', lord: 'Saturn', start: 93.3333, end: 106.6667, deity: 'Brihaspati' },
            { name: 'Ashlesha', lord: 'Mercury', start: 106.6667, end: 120, deity: 'Sarpas' },
            { name: 'Magha', lord: 'Ketu', start: 120, end: 133.3333, deity: 'Pitrs' },
            { name: 'Purva Phalguni', lord: 'Venus', start: 133.3333, end: 146.6667, deity: 'Bhaga' },
            { name: 'Uttara Phalguni', lord: 'Sun', start: 146.6667, end: 160, deity: 'Aryaman' },
            { name: 'Hasta', lord: 'Moon', start: 160, end: 173.3333, deity: 'Savitri' },
            { name: 'Chitra', lord: 'Mars', start: 173.3333, end: 186.6667, deity: 'Vishwakarma' },
            { name: 'Swati', lord: 'Rahu', start: 186.6667, end: 200, deity: 'Vayu' },
            { name: 'Vishakha', lord: 'Jupiter', start: 200, end: 213.3333, deity: 'Indra-Agni' },
            { name: 'Anuradha', lord: 'Saturn', start: 213.3333, end: 226.6667, deity: 'Mitra' },
            { name: 'Jyeshtha', lord: 'Mercury', start: 226.6667, end: 240, deity: 'Indra' },
            { name: 'Mula', lord: 'Ketu', start: 240, end: 253.3333, deity: 'Nirriti' },
            { name: 'Purva Ashadha', lord: 'Venus', start: 253.3333, end: 266.6667, deity: 'Apah' },
            { name: 'Uttara Ashadha', lord: 'Sun', start: 266.6667, end: 280, deity: 'Visvedevas' },
            { name: 'Shravana', lord: 'Moon', start: 280, end: 293.3333, deity: 'Vishnu' },
            { name: 'Dhanishtha', lord: 'Mars', start: 293.3333, end: 306.6667, deity: 'Vasus' },
            { name: 'Shatabhisha', lord: 'Rahu', start: 306.6667, end: 320, deity: 'Varuna' },
            { name: 'Purva Bhadrapada', lord: 'Jupiter', start: 320, end: 333.3333, deity: 'Aja Ekapada' },
            { name: 'Uttara Bhadrapada', lord: 'Saturn', start: 333.3333, end: 346.6667, deity: 'Ahir Budhnya' },
            { name: 'Revati', lord: 'Mercury', start: 346.6667, end: 360, deity: 'Pushan' }
        ];
        for (const nak of naks) if (deg >= nak.start && deg < nak.end) return nak;
        return naks[0];
    }
    
    // Numerology Functions
    function getLifePathNumber(birthDate) {
        const [year, month, day] = birthDate.split('-').map(Number);
        let sum = day + month + year;
        while (sum > 9) sum = Math.floor(sum / 10) + (sum % 10);
        return sum;
    }
    
    function getSoulUrgeNumber(name) {
        const vowels = { a: 1, e: 5, i: 9, o: 6, u: 3, A: 1, E: 5, I: 9, O: 6, U: 3 };
        let sum = 0;
        for (let char of name) if (vowels[char]) sum += vowels[char];
        while (sum > 9) sum = Math.floor(sum / 10) + (sum % 10);
        return sum || 1;
    }
    
    function getChineseZodiac(year) {
        const animals = ['Rat', 'Ox', 'Tiger', 'Rabbit', 'Dragon', 'Snake', 'Horse', 'Goat', 'Monkey', 'Rooster', 'Dog', 'Pig'];
        return animals[(year - 1900) % 12];
    }
    
    function getChineseElement(year) {
        const elements = ['Wood', 'Fire', 'Earth', 'Metal', 'Water'];
        return elements[Math.floor((year - 1900) / 2) % 5];
    }
    
    function getKuaNumber(year, gender) {
        let y = year % 100;
        let sum = Math.floor(y / 10) + (y % 10);
        while (sum > 9) sum = Math.floor(sum / 10) + (sum % 10);
        let kua = gender === 'M' ? 10 - sum : 5 + sum;
        if (kua > 9) kua -= 9;
        if (kua === 5) kua = gender === 'M' ? 2 : 8;
        return kua;
    }
    
    function getKundaliniNumbers(birthDate) {
        const [year, month, day] = birthDate.split('-').map(Number);
        let soul = day; while (soul > 9) soul = Math.floor(soul / 10) + (soul % 10);
        let karma = month; while (karma > 9) karma = Math.floor(karma / 10) + (karma % 10);
        let destiny = day + month + year; while (destiny > 9) destiny = Math.floor(destiny / 10) + (destiny % 10);
        let path = soul + karma + destiny; while (path > 9) path = Math.floor(path / 10) + (path % 10);
        let dharma = year; while (dharma > 9) dharma = Math.floor(dharma / 10) + (dharma % 10);
        return { soul, karma, destiny, path, dharma };
    }
    
    // Prediction Functions
    function getDailyPrediction(sunSign, moonNak) {
        const predictions = [
            `🌟 ${sunSign}: Today brings unexpected opportunities. Stay open to new connections and ideas.`,
            `🌙 ${moonNak} influence: Your intuition is heightened. Trust your gut feelings today.`,
            `💼 Career: A breakthrough moment approaches. Be ready to act on opportunities.`,
            `❤️ Love: Express your true feelings. Vulnerability brings strength to relationships.`,
            `💰 Finance: Smart decisions today will pay off in the coming week.`,
            `🧘 Health: Take time for meditation. Your energy needs grounding and restoration.`
        ];
        return predictions[Math.floor(Math.random() * predictions.length)];
    }
    
    function getWeeklyPrediction(sunSign) {
        return `📆 ${sunSign} Weekly: This week brings clarity to a confusing situation. Mid-week, expect positive news about a project you've been working on. Weekend is perfect for rest and reflection. Financial opportunities appear Thursday.`;
    }
    
    function getMonthlyPrediction(sunSign) {
        return `🌙 ${sunSign} Monthly: This month emphasizes relationships and communication. The full moon brings emotional breakthroughs. Career opportunities appear around the 15th. Focus on self-care during the last week of the month.`;
    }
    
    function getAdvice(sunSign, lifePath) {
        return `✨ Based on your ${sunSign} Sun sign and Life Path ${lifePath}, focus on authentic self-expression. Your natural leadership abilities will shine when you trust your instincts. Consider starting a journaling practice to track your intuitive hits.`;
    }
    
    // DRAW CIRCULAR SVG CHART (FIXED - Fully Rendered)
    function drawCircularChart(ascendant, planets, houses) {
        const size = 520;
        const cx = size/2, cy = size/2;
        const R_outer = 240;
        const R_inner = 30;
        const R_planet = 180;
        const R_houseNum = 200;
        
        let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="background:#010101; border-radius:50%;">`;
        
        // Outer circle border
        svg += `<circle cx="${cx}" cy="${cy}" r="${R_outer}" fill="none" stroke="#d4af37" stroke-width="2.5"/>`;
        svg += `<circle cx="${cx}" cy="${cy}" r="${R_outer-2}" fill="none" stroke="#5f4c2b" stroke-width="0.5"/>`;
        
        // Inner circle
        svg += `<circle cx="${cx}" cy="${cy}" r="${R_inner}" fill="#1a1f2e" stroke="#d4af37" stroke-width="1"/>`;
        
        // Draw 12 house lines (radial lines from center to outer)
        for(let i = 0; i < 12; i++) {
            let angle = 90 - (ascendant + i * 30);
            let rad = angle * Math.PI / 180;
            let x2 = cx + R_outer * Math.cos(rad);
            let y2 = cy - R_outer * Math.sin(rad);
            svg += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#7a6535" stroke-width="1.2" stroke-dasharray="4 3"/>`;
        }
        
        // Draw degree ticks on outer ring (every 10 degrees)
        for(let deg = 0; deg < 360; deg += 10) {
            let rad = (90 - deg) * Math.PI / 180;
            let r1 = R_outer - 8;
            let r2 = R_outer - 2;
            if(deg % 30 === 0) {
                r1 = R_outer - 12;
                r2 = R_outer - 2;
            }
            let x1 = cx + r1 * Math.cos(rad);
            let y1 = cy - r1 * Math.sin(rad);
            let x2 = cx + r2 * Math.cos(rad);
            let y2 = cy - r2 * Math.sin(rad);
            svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#b8963e" stroke-width="0.8"/>`;
        }
        
        // Zodiac symbols at house cusps (outer ring)
        for(let i = 0; i < 12; i++) {
            let angle = 90 - (ascendant + i * 30 + 15);
            let rad = angle * Math.PI / 180;
            let sym = getZodiacSymbol(ascendant + i * 30);
            svg += `<text x="${cx + (R_outer - 15) * Math.cos(rad)}" y="${cy - (R_outer - 15) * Math.sin(rad)}" fill="#e5cb7a" font-size="18" text-anchor="middle" font-weight="bold">${sym}</text>`;
        }
        
        // House numbers (inside the wheel)
        for(let i = 0; i < 12; i++) {
            let angle = 90 - (ascendant + i * 30 + 15);
            let rad = angle * Math.PI / 180;
            svg += `<text x="${cx + R_houseNum * Math.cos(rad)}" y="${cy - R_houseNum * Math.sin(rad)}" fill="#b9a46b" font-size="13" text-anchor="middle" font-weight="bold">${i+1}</text>`;
        }
        
        // Ascendant marker (arrow)
        let ascRad = (90 - ascendant) * Math.PI / 180;
        let ascX = cx + (R_outer - 20) * Math.cos(ascRad);
        let ascY = cy - (R_outer - 20) * Math.sin(ascRad);
        svg += `<polygon points="${ascX-6},${ascY-4} ${ascX+6},${ascY-4} ${ascX},${ascY+10}" fill="#ffb347" stroke="#000" stroke-width="0.5"/>`;
        svg += `<text x="${cx + (R_outer - 8) * Math.cos(ascRad)}" y="${cy - (R_outer - 8) * Math.sin(ascRad)}" fill="#ffb347" font-size="10" text-anchor="middle" font-weight="bold">ASC</text>`;
        
        // Planet symbols and positions
        const planetColors = { Sun: '#f6b83e', Moon: '#bde0fe', Mars: '#ff6b6b', Mercury: '#6bff6b', Jupiter: '#ffb347', Venus: '#ff69b4', Saturn: '#c0c0c0', Rahu: '#8b4513', Ketu: '#654321' };
        const planetSymbols = { Sun: '☉', Moon: '☽', Mars: '♂', Mercury: '☿', Jupiter: '♃', Venus: '♀', Saturn: '♄', Rahu: '☊', Ketu: '☋' };
        
        for(let p of planets) {
            let rad = (90 - p.longitude) * Math.PI / 180;
            let color = planetColors[p.name] || '#FFD966';
            let symbol = planetSymbols[p.name] || p.name.charAt(0);
            let x = cx + R_planet * Math.cos(rad);
            let y = cy - R_planet * Math.sin(rad);
            svg += `<circle cx="${x}" cy="${y}" r="12" fill="#11161f" stroke="${color}" stroke-width="2"/>`;
            svg += `<text x="${x}" y="${y+3}" fill="${color}" font-size="16" text-anchor="middle" font-weight="bold">${symbol}</text>`;
        }
        
        // Center mark
        svg += `<circle cx="${cx}" cy="${cy}" r="10" fill="#2a2315" stroke="#e5bf60" stroke-width="1.5"/>`;
        svg += `<text x="${cx}" y="${cy+2}" fill="#ffeaac" font-size="10" text-anchor="middle" font-weight="bold">M</text>`;
        
        svg += `</svg>`;
        return svg;
    }
    
    // Main calculation function
    function calculateChart(userData) {
        const jd = getJulianDate();
        const lat = parseFloat(userData.latitude);
        const lon = parseFloat(userData.longitude);
        const asc = getAscendant(jd, lat, lon);
        
        const planetsList = ['Sun', 'Moon', 'Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn', 'Rahu', 'Ketu'];
        const planets = [];
        for (const p of planetsList) {
            const lon = getPlanetLongitude(p, jd);
            planets.push({ 
                name: p, 
                longitude: lon, 
                zodiacSign: getZodiacSign(lon), 
                house: getHouseFromLongitude(lon, asc),
                symbol: p === 'Sun' ? '☉' : p === 'Moon' ? '☽' : p.charAt(0)
            });
        }
        
        const houses = [];
        for (let i = 0; i < 12; i++) houses.push((asc + i * 30) % 360);
        
        const moonPlanet = planets.find(p => p.name === 'Moon');
        const nakshatra = moonPlanet ? getNakshatra(moonPlanet.longitude) : null;
        const sunPlanet = planets.find(p => p.name === 'Sun');
        const lifePath = getLifePathNumber(userData.birthDate);
        const year = parseInt(userData.birthDate.split('-')[0]);
        
        return {
            user: { name: userData.name, birthDate: userData.birthDate, location: userData.location },
            chart: { ascendant: asc, ascendantSign: getZodiacSign(asc), houses, planets, nakshatra, sunSign: sunPlanet ? sunPlanet.zodiacSign : 'Unknown' },
            numerology: {
                lifePath, soulUrge: getSoulUrgeNumber(userData.name),
                chineseZodiac: getChineseZodiac(year),
                chineseElement: getChineseElement(year),
                kuaNumber: getKuaNumber(year, 'M'),
                kundalini: getKundaliniNumbers(userData.birthDate)
            },
            predictions: {
                daily: getDailyPrediction(sunPlanet ? sunPlanet.zodiacSign : 'Unknown', nakshatra ? nakshatra.name : 'Unknown'),
                weekly: getWeeklyPrediction(sunPlanet ? sunPlanet.zodiacSign : 'Unknown'),
                monthly: getMonthlyPrediction(sunPlanet ? sunPlanet.zodiacSign : 'Unknown'),
                advice: getAdvice(sunPlanet ? sunPlanet.zodiacSign : 'Unknown', lifePath)
            }
        };
    }
    
    // UI State
    let currentData = null;
    let currentPage = 1;
    
    function renderPage() {
        const content = document.getElementById('pageContent');
        if (!currentData) return;
        
        const c = currentData.chart;
        const n = currentData.numerology;
        const p = currentData.predictions;
        
        if (currentPage === 1) {
            content.innerHTML = `
                <div class="dashboard">
                    <div class="chart-panel">
                        <h3 style="color:#e5cb7a; margin-bottom:1rem;">🌀 CIRCULAR NATAL CHART</h3>
                        ${drawCircularChart(c.ascendant, c.planets, c.houses)}
                    </div>
                    <div class="side-table">
                        <h3>⚡ PLANETARY COORDINATES</h3>
                        <table class="coord-table">
                            <thead><tr><th>Planet</th><th>Longitude</th><th>Sign</th><th>House</th></tr></thead>
                            <tbody>
                                ${c.planets.map(p => `<tr><td>${p.name}</td><td>${p.longitude.toFixed(2)}°</td><td>${p.zodiacSign}</td><td>H${p.house}</td></tr>`).join('')}
                                <tr style="border-top:1px solid #d4af37;"><td>⭐ Ascendant</td><td>${c.ascendant.toFixed(2)}°</td><td>${c.ascendantSign}</td><td>H1</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        } else if (currentPage === 2) {
            content.innerHTML = `<h2>📊 PLANETARY POSITIONS</h2>
                <table class="planet-table"><thead><tr><th>Planet</th><th>Longitude</th><th>Zodiac Sign</th><th>House</th></tr></thead>
                <tbody>${c.planets.map(p => `<tr><td><strong>${p.name}</strong></td><td>${p.longitude.toFixed(2)}°</td><td>${p.zodiacSign}</td><td>House ${p.house}</td></tr>`).join('')}</tbody>
                </table>`;
        } else if (currentPage === 3) {
            const nak = c.nakshatra;
            content.innerHTML = `<h2>✨ NAKSHATRA (Lunar Mansion)</h2>
                <div class="grid-2">
                    <div class="info-card"><strong>🌟 Nakshatra</strong><br>${nak ? nak.name : 'Unknown'}</div>
                    <div class="info-card"><strong>👑 Ruling Planet</strong><br>${nak ? nak.lord : 'Unknown'}</div>
                    <div class="info-card"><strong>🙏 Deity</strong><br>${nak ? nak.deity : 'Unknown'}</div>
                    <div class="info-card"><strong>🎯 Range</strong><br>${nak ? nak.start.toFixed(1) + '° - ' + nak.end.toFixed(1) + '°' : 'Unknown'}</div>
                </div>`;
        } else if (currentPage === 4) {
            content.innerHTML = `<h2>🔢 NUMEROLOGY REPORT</h2>
                <div class="grid-2">
                    <div class="info-card"><strong>📖 Life Path Number</strong><br>${n.lifePath}</div>
                    <div class="info-card"><strong>💖 Soul Urge Number</strong><br>${n.soulUrge}</div>
                </div>
                <h3 style="margin-top:1.5rem;">🌌 Kundalini Five Numbers</h3>
                <div class="grid-4">
                    <div class="info-card"><strong>Soul</strong><br>${n.kundalini.soul}</div>
                    <div class="info-card"><strong>Karma</strong><br>${n.kundalini.karma}</div>
                    <div class="info-card"><strong>Destiny</strong><br>${n.kundalini.destiny}</div>
                    <div class="info-card"><strong>Path</strong><br>${n.kundalini.path}</div>
                    <div class="info-card"><strong>Dharma</strong><br>${n.kundalini.dharma}</div>
                </div>`;
        } else if (currentPage === 5) {
            content.innerHTML = `<h2>🐉 CHINESE ASTROLOGY</h2>
                <div class="grid-2">
                    <div class="info-card"><strong>🐀 Zodiac Animal</strong><br>${n.chineseZodiac}</div>
                    <div class="info-card"><strong>🌿 Element</strong><br>${n.chineseElement}</div>
                    <div class="info-card"><strong>☯️ Yin/Yang</strong><br>${parseInt(currentData.user.birthDate.split('-')[0]) % 2 === 0 ? 'Yang' : 'Yin'}</div>
                    <div class="info-card"><strong>🧘 Kua Number</strong><br>${n.kuaNumber}</div>
                </div>`;
        } else if (currentPage === 6) {
            content.innerHTML = `<h2>📅 DAILY PREDICTION</h2>
                <div class="prediction-card">${p.daily}</div>
                <div class="grid-2" style="margin-top:1rem;">
                    <div class="info-card"><strong>✨ Lucky Color</strong><br>Gold / Yellow</div>
                    <div class="info-card"><strong>🔢 Lucky Number</strong><br>${n.lifePath}</div>
                </div>`;
        } else if (currentPage === 7) {
            content.innerHTML = `<h2>📆 WEEKLY PREDICTION</h2><div class="prediction-card">${p.weekly}</div>`;
        } else if (currentPage === 8) {
            content.innerHTML = `<h2>🌙 MONTHLY PREDICTION</h2><div class="prediction-card">${p.monthly}</div>`;
        } else if (currentPage === 9) {
            content.innerHTML = `<h2>📖 PERSONALIZED ADVICE</h2>
                <div class="prediction-card">${p.advice}</div>
                <div class="grid-2" style="margin-top:1rem;">
                    <div class="info-card"><strong>💎 Recommended Gemstone</strong><br>Amethyst / Citrine</div>
                    <div class="info-card"><strong>🕯️ Mantra</strong><br>Om Namah Shivaya</div>
                    <div class="info-card"><strong>🧘 Daily Practice</strong><br>10 min morning meditation</div>
                </div>`;
        }
    }
    
    function generateChart() {
        const errorDiv = document.getElementById('errorMessage');
        const btn = document.getElementById('enterBtn');
        
        const name = document.getElementById('userName').value.trim();
        const day = document.getElementById('birthDay').value;
        const month = document.getElementById('birthMonth').value;
        const year = document.getElementById('birthYear').value;
        const hour = document.getElementById('birthHour').value;
        const minute = document.getElementById('birthMinute').value;
        const location = document.getElementById('birthLocation').value.trim();
        let lat = document.getElementById('latitude').value;
        let lon = document.getElementById('longitude').value;
        
        if (!name || !day || !month || !year || !hour || !minute || !location) {
            errorDiv.innerHTML = '❌ Please fill all fields';
            errorDiv.style.display = 'block';
            return;
        }
        
        lat = lat || 23.8103;
        lon = lon || 90.4125;
        
        errorDiv.style.display = 'none';
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span> Calculating your chart...';
        
        setTimeout(() => {
            currentData = calculateChart({
                name, birthDate: `${year}-${month}-${day}`,
                birthTime: `${hour}:${minute}:00`, location,
                latitude: parseFloat(lat), longitude: parseFloat(lon)
            });
            
            localStorage.setItem('shivanetra_data', JSON.stringify(currentData));
            document.getElementById('landingPage').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('displayUser').innerHTML = `${name} | ${day}/${month}/${year} | ${location}`;
            
            // Set active page to 1
            currentPage = 1;
            document.querySelectorAll('.page-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.page-btn[data-page="1"]').classList.add('active');
            renderPage();
            
            btn.disabled = false;
            btn.innerHTML = '🔮 GENERATE MY CHART';
        }, 300);
    }
    
    function downloadHTML() {
        if (!currentData) {
            alert('No chart data to download. Please generate a chart first.');
            return;
        }
        const html = document.documentElement.outerHTML;
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Shivanetra_Chart_${currentData.user.name.replace(/\s/g, '_')}_${new Date().toISOString().slice(0,10)}.html`;
        a.click();
        URL.revokeObjectURL(url);
    }
    
    // Event Listeners
    document.getElementById('enterBtn').addEventListener('click', generateChart);
    document.getElementById('changeUserBtn').addEventListener('click', () => {
        document.getElementById('landingPage').style.display = 'block';
        document.getElementById('mainApp').style.display = 'none';
        currentData = null;
    });
    document.getElementById('downloadBtn').addEventListener('click', downloadHTML);
    
    document.querySelectorAll('.page-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            currentPage = parseInt(btn.dataset.page);
            document.querySelectorAll('.page-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderPage();
        });
    });
    
    // Load saved data on startup
    const savedData = localStorage.getItem('shivanetra_data');
    if (savedData) {
        try {
            currentData = JSON.parse(savedData);
            document.getElementById('landingPage').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('displayUser').innerHTML = `${currentData.user.name} | ${currentData.user.birthDate.split('-')[2]}/${currentData.user.birthDate.split('-')[1]}/${currentData.user.birthDate.split('-')[0]} | ${currentData.user.location}`;
            renderPage();
        } catch(e) { console.log('Error loading saved data'); }
    }
</script>
