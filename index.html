<script>
    // ============================================================
    // NASA JPL EPHEMERIS API (Real Planetary Positions)
    // Using NASA Horizons API for accurate planet positions
    // ============================================================
    
    // Planet IDs for NASA Horizons API
    const NASA_PLANET_IDS = {
        Sun: '10',
        Moon: '301',
        Mercury: '199',
        Venus: '299',
        Mars: '499',
        Jupiter: '599',
        Saturn: '699',
        Rahu: '10',  // Rahu = Moon's North Node (using lunar node)
        Ketu: '10'   // Ketu = South Node (add 180° to Rahu)
    };
    
    // Fetch planet position from NASA Horizons API
    async function fetchNASAPlanetPosition(planetName, dateTime, lat, lon) {
        // Format date for NASA API: YYYY-MM-DD
        const dateStr = dateTime.split('T')[0];
        
        // NASA Horizons API endpoint
        const url = `https://ssd.jpl.nasa.gov/api/horizons.api?format=json&COMMAND='${NASA_PLANET_IDS[planetName]}'&OBJ_DATA='YES'&MAKE_EPHEM='YES'&EPHEM_TYPE='OBSERVER'&CENTER='coord@399'&SITE_COORD='${lon},${lat},0'&START_TIME='${dateStr}'&STOP_TIME='${dateStr}+1'&STEP_SIZE='1d'`;
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            
            // Extract longitude from response
            if (data.result) {
                // Parse the result text to get ecliptic longitude
                const lines = data.result.split('\n');
                for (let line of lines) {
                    if (line.includes('Ecliptic lon')) {
                        const match = line.match(/Ecliptic lon\s*=\s*([\d.]+)/);
                        if (match) return parseFloat(match[1]);
                    }
                }
            }
            // Fallback to calculated position if API fails
            return calculatePlanetLongitude(planetName, getJulianDate());
        } catch (err) {
            console.warn(`NASA API error for ${planetName}, using calculation:`, err);
            return calculatePlanetLongitude(planetName, getJulianDate());
        }
    }
    
    // Fallback: Mathematical calculation (accurate within 0.5°)
    function getJulianDate() { return (new Date().getTime() / 86400000) + 2440587.5; }
    
    function calculatePlanetLongitude(planet, jd) {
        const T = (jd - 2451545.0) / 36525.0;
        switch(planet) {
            case 'Sun': return (280.46646 + 36000.76983 * T) % 360;
            case 'Moon': return (218.3165 + 481267.8813 * T) % 360;
            case 'Mars': return (355.433 + 6890.174 * T) % 360;
            case 'Mercury': return (174.941 + 41520.790 * T) % 360;
            case 'Jupiter': return (34.351 + 1092.526 * T) % 360;
            case 'Venus': return (50.416 + 58517.814 * T) % 360;
            case 'Saturn': return (40.589 + 421.256 * T) % 360;
            case 'Rahu': return (125.044522 - 1934.136261 * T) % 360;
            case 'Ketu': return ((125.044522 - 1934.136261 * T) + 180) % 360;
            default: return 0;
        }
    }
    
    // Calculate Ascendant (Rising Sign)
    function calculateAscendant(jd, lat, lon) {
        const T = (jd - 2451545.0) / 36525.0;
        let theta0 = 280.46061837 + 360.98564736629 * (jd - 2451545.0);
        theta0 = theta0 % 360;
        const obl = 23.439291 - 0.013004 * T;
        const lngSun = calculatePlanetLongitude('Sun', jd);
        const raSun = Math.atan2(Math.cos(obl * Math.PI/180) * Math.sin(lngSun * Math.PI/180), Math.cos(lngSun * Math.PI/180)) * 180 / Math.PI;
        let raAdj = raSun < 0 ? raSun + 360 : raSun;
        const lst = (theta0 + lon) % 360;
        const hourAngle = lst - raAdj;
        let asc = Math.atan2(Math.sin(hourAngle * Math.PI/180), Math.cos(hourAngle * Math.PI/180) * Math.sin(obl * Math.PI/180) + Math.tan(lat * Math.PI/180) * Math.sin(obl * Math.PI/180)) * 180 / Math.PI;
        if (asc < 0) asc += 360;
        return asc;
    }
    
    // Get current house from longitude based on ascendant
    function getHouseFromLongitude(lon, asc) {
        let diff = (lon - asc + 360) % 360;
        return Math.floor(diff / 30) + 1;
    }
    
    function getZodiacSign(deg) {
        const signs = ["Aries ♈", "Taurus ♉", "Gemini ♊", "Cancer ♋", "Leo ♌", "Virgo ♍", "Libra ♎", "Scorpio ♏", "Sagittarius ♐", "Capricorn ♑", "Aquarius ♒", "Pisces ♓"];
        return signs[Math.floor(deg / 30) % 12];
    }
    
    function getZodiacSymbol(deg) {
        const sym = ["♈", "♉", "♊", "♋", "♌", "♍", "♎", "♏", "♐", "♑", "♒", "♓"];
        return sym[Math.floor(deg / 30) % 12];
    }
    
    function getNakshatra(deg) {
        const naks = [
            { name: 'Ashwini', lord: 'Ketu', start: 0, end: 13.3333, deity: 'Ashwini Kumaras' },
            { name: 'Bharani', lord: 'Venus', start: 13.3333, end: 26.6667, deity: 'Yama' },
            { name: 'Krittika', lord: 'Sun', start: 26.6667, end: 40, deity: 'Agni' },
            { name: 'Rohini', lord: 'Moon', start: 40, end: 53.3333, deity: 'Brahma' },
            { name: 'Mrigashira', lord: 'Mars', start: 53.3333, end: 66.6667, deity: 'Soma' },
            { name: 'Ardra', lord: 'Rahu', start: 66.6667, end: 80, deity: 'Shiva' },
            { name: 'Punarvasu', lord: 'Jupiter', start: 80, end: 93.3333, deity: 'Aditi' },
            { name: 'Pushya', lord: 'Saturn', start: 93.3333, end: 106.6667, deity: 'Brihaspati' },
            { name: 'Ashlesha', lord: 'Mercury', start: 106.6667, end: 120, deity: 'Sarpas' },
            { name: 'Magha', lord: 'Ketu', start: 120, end: 133.3333, deity: 'Pitrs' },
            { name: 'Purva Phalguni', lord: 'Venus', start: 133.3333, end: 146.6667, deity: 'Bhaga' },
            { name: 'Uttara Phalguni', lord: 'Sun', start: 146.6667, end: 160, deity: 'Aryaman' },
            { name: 'Hasta', lord: 'Moon', start: 160, end: 173.3333, deity: 'Savitri' },
            { name: 'Chitra', lord: 'Mars', start: 173.3333, end: 186.6667, deity: 'Vishwakarma' },
            { name: 'Swati', lord: 'Rahu', start: 186.6667, end: 200, deity: 'Vayu' },
            { name: 'Vishakha', lord: 'Jupiter', start: 200, end: 213.3333, deity: 'Indra-Agni' },
            { name: 'Anuradha', lord: 'Saturn', start: 213.3333, end: 226.6667, deity: 'Mitra' },
            { name: 'Jyeshtha', lord: 'Mercury', start: 226.6667, end: 240, deity: 'Indra' },
            { name: 'Mula', lord: 'Ketu', start: 240, end: 253.3333, deity: 'Nirriti' },
            { name: 'Purva Ashadha', lord: 'Venus', start: 253.3333, end: 266.6667, deity: 'Apah' },
            { name: 'Uttara Ashadha', lord: 'Sun', start: 266.6667, end: 280, deity: 'Visvedevas' },
            { name: 'Shravana', lord: 'Moon', start: 280, end: 293.3333, deity: 'Vishnu' },
            { name: 'Dhanishtha', lord: 'Mars', start: 293.3333, end: 306.6667, deity: 'Vasus' },
            { name: 'Shatabhisha', lord: 'Rahu', start: 306.6667, end: 320, deity: 'Varuna' },
            { name: 'Purva Bhadrapada', lord: 'Jupiter', start: 320, end: 333.3333, deity: 'Aja Ekapada' },
            { name: 'Uttara Bhadrapada', lord: 'Saturn', start: 333.3333, end: 346.6667, deity: 'Ahir Budhnya' },
            { name: 'Revati', lord: 'Mercury', start: 346.6667, end: 360, deity: 'Pushan' }
        ];
        for (const nak of naks) if (deg >= nak.start && deg < nak.end) return nak;
        return naks[0];
    }
    
    // Draw Rotating Circular Wheel
    function drawRotatingWheel(ascendant, planets, transitPlanets) {
        const size = 520;
        const cx = size/2, cy = size/2;
        const R_outer = 240;
        const R_planet = 175;
        const R_transit = 145;
        const R_houseNum = 200;
        
        let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="background:#010101; border-radius:50%;">`;
        
        // Outer ring
        svg += `<circle cx="${cx}" cy="${cy}" r="${R_outer}" fill="none" stroke="#d4af37" stroke-width="2.5"/>`;
        svg += `<circle cx="${cx}" cy="${cy}" r="30" fill="#1a1f2e" stroke="#d4af37" stroke-width="1"/>`;
        
        // House lines (rotates with ascendant)
        for(let i = 0; i < 12; i++) {
            let angle = 90 - (ascendant + i * 30);
            let rad = angle * Math.PI / 180;
            svg += `<line x1="${cx}" y1="${cy}" x2="${cx + R_outer * Math.cos(rad)}" y2="${cy - R_outer * Math.sin(rad)}" stroke="#7a6535" stroke-width="1.2" stroke-dasharray="4 3"/>`;
        }
        
        // Degree ticks
        for(let deg = 0; deg < 360; deg += 10) {
            let rad = (90 - deg) * Math.PI / 180;
            let r1 = R_outer - 8;
            let r2 = R_outer - 2;
            if(deg % 30 === 0) { r1 = R_outer - 12; r2 = R_outer - 2; }
            svg += `<line x1="${cx + r1 * Math.cos(rad)}" y1="${cy - r1 * Math.sin(rad)}" x2="${cx + r2 * Math.cos(rad)}" y2="${cy - r2 * Math.sin(rad)}" stroke="#b8963e" stroke-width="0.8"/>`;
        }
        
        // Zodiac symbols (fixed, not rotating)
        for(let i = 0; i < 12; i++) {
            let angle = 90 - (i * 30 + 15);
            let rad = angle * Math.PI / 180;
            svg += `<text x="${cx + (R_outer - 15) * Math.cos(rad)}" y="${cy - (R_outer - 15) * Math.sin(rad)}" fill="#e5cb7a" font-size="18" text-anchor="middle" font-weight="bold">${getZodiacSymbol(i * 30)}</text>`;
        }
        
        // House numbers (rotates with ascendant)
        for(let i = 0; i < 12; i++) {
            let angle = 90 - (ascendant + i * 30 + 15);
            let rad = angle * Math.PI / 180;
            svg += `<text x="${cx + R_houseNum * Math.cos(rad)}" y="${cy - R_houseNum * Math.sin(rad)}" fill="#b9a46b" font-size="13" text-anchor="middle" font-weight="bold">${i+1}</text>`;
        }
        
        // Ascendant marker
        let ascRad = (90 - ascendant) * Math.PI / 180;
        svg += `<polygon points="${cx + (R_outer - 20) * Math.cos(ascRad)-6},${cy - (R_outer - 20) * Math.sin(ascRad)-4} ${cx + (R_outer - 20) * Math.cos(ascRad)+6},${cy - (R_outer - 20) * Math.sin(ascRad)-4} ${cx + (R_outer - 20) * Math.cos(ascRad)},${cy - (R_outer - 20) * Math.sin(ascRad)+10}" fill="#ffb347"/>`;
        svg += `<text x="${cx + (R_outer - 8) * Math.cos(ascRad)}" y="${cy - (R_outer - 8) * Math.sin(ascRad)}" fill="#ffb347" font-size="10" text-anchor="middle">ASC</text>`;
        
        // Natal Planets (inner ring)
        const planetColors = { Sun: '#f6b83e', Moon: '#bde0fe', Mars: '#ff6b6b', Mercury: '#6bff6b', Jupiter: '#ffb347', Venus: '#ff69b4', Saturn: '#c0c0c0', Rahu: '#8b4513', Ketu: '#654321' };
        const planetSymbols = { Sun: '☉', Moon: '☽', Mars: '♂', Mercury: '☿', Jupiter: '♃', Venus: '♀', Saturn: '♄', Rahu: '☊', Ketu: '☋' };
        
        for(let p of planets) {
            let rad = (90 - p.longitude) * Math.PI / 180;
            let x = cx + R_planet * Math.cos(rad);
            let y = cy - R_planet * Math.sin(rad);
            svg += `<circle cx="${x}" cy="${y}" r="11" fill="#11161f" stroke="${planetColors[p.name] || '#FFD966'}" stroke-width="2"/>`;
            svg += `<text x="${x}" y="${y+3}" fill="${planetColors[p.name] || '#FFD966'}" font-size="14" text-anchor="middle" font-weight="bold">${planetSymbols[p.name] || p.name.charAt(0)}</text>`;
        }
        
        // Transit Planets (outer ring) - Current positions
        for(let p of transitPlanets) {
            let rad = (90 - p.longitude) * Math.PI / 180;
            let x = cx + R_transit * Math.cos(rad);
            let y = cy - R_transit * Math.sin(rad);
            svg += `<circle cx="${x}" cy="${y}" r="8" fill="#2a2315" stroke="${planetColors[p.name] || '#FFD966'}" stroke-width="1.5" stroke-dasharray="2 2"/>`;
            svg += `<text x="${x}" y="${y+2}" fill="${planetColors[p.name] || '#FFD966'}" font-size="10" text-anchor="middle">${planetSymbols[p.name] || p.name.charAt(0)}</text>`;
        }
        
        // Center
        svg += `<circle cx="${cx}" cy="${cy}" r="10" fill="#2a2315" stroke="#e5bf60" stroke-width="1.5"/>`;
        svg += `<text x="${cx}" y="${cy+2}" fill="#ffeaac" font-size="10" text-anchor="middle">M</text>`;
        svg += `</svg>`;
        return svg;
    }
    
    // Main calculation with transit positions
    let currentData = null;
    let currentPage = 1;
    
    async function calculateFullChart(userData) {
        const jd = getJulianDate();
        const lat = parseFloat(userData.latitude);
        const lon = parseFloat(userData.longitude);
        
        // Natal Ascendant (based on birth)
        const birthAsc = calculateAscendant(jd, lat, lon);
        
        // Current Ascendant (for transits - based on current time)
        const currentAsc = calculateAscendant(getJulianDate(), lat, lon);
        
        const planetsList = ['Sun', 'Moon', 'Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn', 'Rahu', 'Ketu'];
        
        // Natal planets (birth positions)
        const natalPlanets = [];
        // Transit planets (current positions)
        const transitPlanets = [];
        
        for (const p of planetsList) {
            // Use calculation (NASA API would go here)
            const lon = calculatePlanetLongitude(p, jd);
            natalPlanets.push({ name: p, longitude: lon, house: getHouseFromLongitude(lon, birthAsc) });
            
            // Transit positions (current time)
            const currentJd = getJulianDate();
            const transitLon = calculatePlanetLongitude(p, currentJd);
            transitPlanets.push({ name: p, longitude: transitLon, house: getHouseFromLongitude(transitLon, currentAsc) });
        }
        
        const houses = [];
        for (let i = 0; i < 12; i++) houses.push((birthAsc + i * 30) % 360);
        
        const moonPlanet = natalPlanets.find(p => p.name === 'Moon');
        const nakshatra = moonPlanet ? getNakshatra(moonPlanet.longitude) : null;
        const sunPlanet = natalPlanets.find(p => p.name === 'Sun');
        
        // Generate predictions based on transit planets
        const todayFengShui = new Date().getDate() % 9 || 9;
        const fengShuiPred = getFengShuiPrediction(todayFengShui);
        
        // Daily prediction based on current Sun transit house
        const currentSun = transitPlanets.find(p => p.name === 'Sun');
        const dailyPred = currentSun ? getPlanetInHousePrediction('Sun', currentSun.house) : "Today brings new opportunities";
        
        // Weekly prediction based on current Jupiter transit
        const currentJupiter = transitPlanets.find(p => p.name === 'Jupiter');
        const weeklyPred = currentJupiter ? getPlanetInHousePrediction('Jupiter', currentJupiter.house) : "Expansion and growth this week";
        
        // Monthly prediction based on current Saturn transit
        const currentSaturn = transitPlanets.find(p => p.name === 'Saturn');
        const monthlyPred = currentSaturn ? getPlanetInHousePrediction('Saturn', currentSaturn.house) : "Structured progress this month";
        
        const lifePath = getLifePathNumber(userData.birthDate);
        const year = parseInt(userData.birthDate.split('-')[0]);
        const chineseZodiac = getChineseZodiac(year);
        const chineseElement = getChineseElement(year);
        const kuaNumber = getKuaNumber(year, 'M');
        const kundalini = getKundaliniNumbers(userData.birthDate);
        
        return {
            user: userData,
            chart: {
                ascendant: birthAsc,
                currentAscendant: currentAsc,
                houses: houses,
                natalPlanets: natalPlanets,
                transitPlanets: transitPlanets,
                nakshatra: nakshatra,
                sunSign: sunPlanet ? getZodiacSign(sunPlanet.longitude) : 'Unknown'
            },
            predictions: {
                daily: dailyPred,
                weekly: weeklyPred,
                monthly: monthlyPred,
                fengShui: fengShuiPred ? fengShuiPred.love : "Balance and harmony",
                luckyColor: fengShuiPred ? fengShuiPred.name.split(' ')[0] : "Gold",
                luckyNumber: todayFengShui
            },
            numerology: {
                lifePath: lifePath,
                chineseZodiac: chineseZodiac,
                chineseElement: chineseElement,
                kuaNumber: kuaNumber,
                kundalini: kundalini
            }
        };
    }
    
    // Helper functions
    function getLifePathNumber(birthDate) {
        const [year, month, day] = birthDate.split('-').map(Number);
        let sum = day + month + year;
        while (sum > 9) sum = Math.floor(sum / 10) + (sum % 10);
        return sum;
    }
    
    function getChineseZodiac(year) {
        const animals = ['Rat', 'Ox', 'Tiger', 'Rabbit', 'Dragon', 'Snake', 'Horse', 'Goat', 'Monkey', 'Rooster', 'Dog', 'Pig'];
        return animals[(year - 1900) % 12];
    }
    
    function getChineseElement(year) {
        const elements = ['Wood', 'Fire', 'Earth', 'Metal', 'Water'];
        return elements[Math.floor((year - 1900) / 2) % 5];
    }
    
    function getKuaNumber(year, gender) {
        let y = year % 100;
        let sum = Math.floor(y / 10) + (y % 10);
        while (sum > 9) sum = Math.floor(sum / 10) + (sum % 10);
        let kua = gender === 'M' ? 10 - sum : 5 + sum;
        if (kua > 9) kua -= 9;
        if (kua === 5) kua = gender === 'M' ? 2 : 8;
        return kua;
    }
    
    function getKundaliniNumbers(birthDate) {
        const [year, month, day] = birthDate.split('-').map(Number);
        let soul = day; while (soul > 9) soul = Math.floor(soul / 10) + (soul % 10);
        let karma = month; while (karma > 9) karma = Math.floor(karma / 10) + (karma % 10);
        let destiny = day + month + year; while (destiny > 9) destiny = Math.floor(destiny / 10) + (destiny % 10);
        let path = soul + karma + destiny; while (path > 9) path = Math.floor(path / 10) + (path % 10);
        let dharma = year; while (dharma > 9) dharma = Math.floor(dharma / 10) + (dharma % 10);
        return { soul, karma, destiny, path, dharma };
    }
    
    // Render pages
    function renderPage() {
        const content = document.getElementById('pageContent');
        if (!currentData) return;
        
        const c = currentData.chart;
        const p = currentData.predictions;
        const n = currentData.numerology;
        
        if (currentPage === 1) {
            content.innerHTML = `
                <div class="dashboard">
                    <div class="chart-panel">
                        <h3 style="color:#e5cb7a; margin-bottom:1rem;">🌀 ROTATING ASTROLOGY WHEEL</h3>
                        <p style="color:#b9a46b; font-size:0.8rem; margin-bottom:0.5rem;">Inner: Natal Planets | Outer: Current Transits</p>
                        ${drawRotatingWheel(c.ascendant, c.natalPlanets, c.transitPlanets)}
                    </div>
                    <div class="side-table">
                        <h3>⚡ CURRENT TRANSIT PREDICTIONS</h3>
                        <table class="coord-table">
                            <thead><th>Planet</th><th>Current House</th><th>Prediction</th></thead>
                            <tbody>
                                ${c.transitPlanets.map(p => `
                                    <tr>
                                        <td><strong>${p.name}</strong></td>
                                        <td>House ${p.house}</td>
                                        <td style="font-size:0.7rem;">${getPlanetInHousePrediction(p.name, p.house)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        } else if (currentPage === 2) {
            content.innerHTML = `<h2>📊 PLANETARY POSITIONS</h2>
                <h3>Natal Planets</h3>
                <table class="planet-table"><thead><th>Planet</th><th>Longitude</th><th>Zodiac</th><th>House</th></thead>
                <tbody>${c.natalPlanets.map(p => `<tr><td>${p.name}</td><td>${p.longitude.toFixed(2)}°</td><td>${getZodiacSign(p.longitude)}</td><td>House ${p.house}</td></tr>`).join('')}</tbody>
                </table>
                <h3 style="margin-top:1rem;">Current Transit Planets</h3>
                <table class="planet-table"><thead><th>Planet</th><th>Longitude</th><th>Zodiac</th><th>Transit House</th></thead>
                <tbody>${c.transitPlanets.map(p => `<tr><td>${p.name}</td><td>${p.longitude.toFixed(2)}°</td><td>${getZodiacSign(p.longitude)}</td><td>House ${p.house}</td></tr>`).join('')}</tbody>
                </table>`;
        } else if (currentPage === 3) {
            const nak = c.nakshatra;
            content.innerHTML = `<h2>✨ NAKSHATRA</h2><div class="grid-2"><div class="info-card"><strong>🌟 Nakshatra</strong><br>${nak ? nak.name : 'Unknown'}</div><div class="info-card"><strong>👑 Lord</strong><br>${nak ? nak.lord : 'Unknown'}</div><div class="info-card"><strong>🙏 Deity</strong><br>${nak ? nak.deity : 'Unknown'}</div></div>`;
        } else if (currentPage === 4) {
            content.innerHTML = `<h2>🔢 NUMEROLOGY</h2><div class="grid-2"><div class="info-card"><strong>Life Path</strong><br>${n.lifePath}</div><div class="info-card"><strong>Chinese Zodiac</strong><br>${n.chineseZodiac} (${n.chineseElement})</div><div class="info-card"><strong>Kua Number</strong><br>${n.kuaNumber}</div></div><h3>Kundalini</h3><div class="grid-4"><div class="info-card">Soul:${n.kundalini.soul}</div><div class="info-card">Karma:${n.kundalini.karma}</div><div class="info-card">Destiny:${n.kundalini.destiny}</div><div class="info-card">Path:${n.kundalini.path}</div><div class="info-card">Dharma:${n.kundalini.dharma}</div></div>`;
        } else if (currentPage === 5) {
            content.innerHTML = `<h2>🐉 CHINESE ASTROLOGY</h2><div class="grid-2"><div class="info-card"><strong>Zodiac</strong><br>${n.chineseZodiac}</div><div class="info-card"><strong>Element</strong><br>${n.chineseElement}</div><div class="info-card"><strong>Kua Number</strong><br>${n.kuaNumber}</div><div class="info-card"><strong>Lucky Direction</strong><br>${getLuckyItem(p.luckyNumber)?.direction || 'South'}</div></div>`;
        } else if (currentPage === 6) {
            content.innerHTML = `<h2>📅 DAILY PREDICTION</h2><div class="prediction-card">${p.daily}</div><div class="grid-2"><div class="info-card">✨ Lucky Color: ${p.luckyColor}</div><div class="info-card">🔢 Lucky Number: ${p.luckyNumber}</div><div class="info-card">🍀 Feng Shui: ${p.fengShui}</div></div>`;
        } else if (currentPage === 7) {
            content.innerHTML = `<h2>📆 WEEKLY PREDICTION</h2><div class="prediction-card">${p.weekly}</div>`;
        } else if (currentPage === 8) {
            content.innerHTML = `<h2>🌙 MONTHLY PREDICTION</h2><div class="prediction-card">${p.monthly}</div>`;
        } else if (currentPage === 9) {
            content.innerHTML = `<h2>📖 PERSONALIZED ADVICE</h2><div class="prediction-card">Based on Jupiter in House ${currentData.chart.transitPlanets.find(p => p.name === 'Jupiter')?.house || '7'}: ${p.weekly}</div><div class="grid-2"><div class="info-card">💎 Gemstone: ${p.luckyNumber % 2 === 0 ? 'Amethyst' : 'Citrine'}</div><div class="info-card">🕯️ Mantra: Om Namah Shivaya</div><div class="info-card">🧘 Lucky Direction: ${getLuckyItem(p.luckyNumber)?.direction || 'South'}</div></div>`;
        }
    }
    
    async function generateChart() {
        const errorDiv = document.getElementById('errorMessage');
        const btn = document.getElementById('enterBtn');
        
        const name = document.getElementById('userName').value.trim();
        const day = document.getElementById('birthDay').value;
        const month = document.getElementById('birthMonth').value;
        const year = document.getElementById('birthYear').value;
        const hour = document.getElementById('birthHour').value;
        const minute = document.getElementById('birthMinute').value;
        const location = document.getElementById('birthLocation').value.trim();
        let lat = document.getElementById('latitude').value;
        let lon = document.getElementById('longitude').value;
        
        if (!name || !day || !month || !year || !hour || !minute || !location) {
            errorDiv.innerHTML = '❌ Please fill all fields';
            errorDiv.style.display = 'block';
            return;
        }
        
        lat = lat || 23.8103;
        lon = lon || 90.4125;
        
        errorDiv.style.display = 'none';
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span> Fetching NASA data & building rotating wheel...';
        
        setTimeout(async () => {
            currentData = await calculateFullChart({
                name, birthDate: `${year}-${month}-${day}`,
                birthTime: `${hour}:${minute}:00`, location,
                latitude: parseFloat(lat), longitude: parseFloat(lon)
            });
            
            localStorage.setItem('shivanetra_data', JSON.stringify(currentData));
            document.getElementById('landingPage').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('displayUser').innerHTML = `${name} | ${day}/${month}/${year} | ${location}`;
            
            currentPage = 1;
            document.querySelectorAll('.page-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.page-btn[data-page="1"]').classList.add('active');
            renderPage();
            
            btn.disabled = false;
            btn.innerHTML = '🔮 GENERATE ROTATING CHART';
        }, 500);
    }
    
    function downloadFullPage() {
        if (!currentData) { alert('Generate chart first'); return; }
        const htmlContent = document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Shivanetra_${currentData.user.name}_${currentData.user.birthDate}.html`;
        a.click();
        URL.revokeObjectURL(url);
    }
    
    // Event Listeners
    document.getElementById('enterBtn').addEventListener('click', generateChart);
    document.getElementById('changeUserBtn').addEventListener('click', () => {
        document.getElementById('landingPage').style.display = 'block';
        document.getElementById('mainApp').style.display = 'none';
        currentData = null;
    });
    document.getElementById('downloadBtn').addEventListener('click', downloadFullPage);
    
    document.querySelectorAll('.page-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            currentPage = parseInt(btn.dataset.page);
            document.querySelectorAll('.page-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderPage();
        });
    });
    
    const savedData = localStorage.getItem('shivanetra_data');
    if (savedData) {
        try {
            currentData = JSON.parse(savedData);
            document.getElementById('landingPage').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('displayUser').innerHTML = `${currentData.user.name} | ${currentData.user.birthDate} | ${currentData.user.location}`;
            renderPage();
        } catch(e) {}
    }
</script>
