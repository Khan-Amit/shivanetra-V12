<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shivanetra V12 | NASA-Powered Astrology</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(145deg, #0b0f1c 0%, #0a0e1a 100%);
            color: #f0eef7;
            padding: 1rem;
        }
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(15, 20, 35, 0.65);
            border-radius: 2.5rem;
            padding: 1rem 1.5rem 2rem;
        }
        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255,215,150,0.3);
            padding-bottom: 0.75rem;
        }
        .tab-btn {
            background: rgba(25, 32, 55, 0.7);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            font-weight: 600;
            cursor: pointer;
            color: #cdd9ff;
        }
        .tab-btn.active {
            background: #e9b35f;
            color: #0a0c18;
        }
        .page { display: none; }
        .page.active-page { display: block; }
        .prediction-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .card {
            background: #111725;
            border-radius: 1.5rem;
            padding: 1rem;
            border: 1px solid #2a2f46;
        }
        .badge {
            background: #e9b35f;
            color: #0b0e1a;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        .status-msg { font-size: 0.8rem; color: #b9c8ff; margin-top: 0.5rem; }
        button {
            background: #e9b35f;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
        }
        .loading { text-align: center; padding: 2rem; color: #e9b35f; }
        canvas {
            background: radial-gradient(circle at 30% 20%, #1a1f32, #080c18);
            border-radius: 50%;
            max-width: 450px;
            width: 100%;
            aspect-ratio: 1/1;
            margin: 0 auto;
            display: block;
        }
        .wheel-section { text-align: center; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="nav-tabs">
        <button class="tab-btn" data-page="home">🌿 Home</button>
        <button class="tab-btn active" data-page="wheel">🌀 Wheel</button>
        <button class="tab-btn" data-page="planets">🪐 Planets</button>
        <button class="tab-btn" data-page="nakshatra">✨ Nakshatra</button>
        <button class="tab-btn" data-page="advice">💎 Advice</button>
    </div>

    <div id="home" class="page">
        <h1>🌌 Shivanetra V12</h1>
        <p>NASA Horizons API • Real Planet Positions • Surya Siddhanta Wisdom</p>
        <div class="card">
            <p id="apiStatus" class="status-msg">Connecting to backend at localhost:5000...</p>
            <button onclick="fetchData(true)">🔄 Refresh from NASA</button>
        </div>
    </div>

    <div id="wheel" class="page active-page">
        <div class="wheel-section">
            <h2>🌀 Celestial Compass</h2>
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
            <button onclick="drawWheel()" style="margin-top: 1rem;">🔄 Redraw Wheel</button>
        </div>
    </div>

    <div id="planets" class="page">
        <h2>🪐 Planet Positions (NASA Horizons)</h2>
        <div id="planetTable" class="prediction-grid">Loading...</div>
    </div>

    <div id="nakshatra" class="page">
        <h2>✨ Nakshatra Positions</h2>
        <div id="nakshatraList" class="prediction-grid"></div>
    </div>

    <div id="advice" class="page">
        <h2>💎 Gemstone Recommendations</h2>
        <div id="adviceList" class="prediction-grid"></div>
    </div>
</div>

<script>
    let planetData = {};
    let lastUpdate = null;

    async function fetchData(forceRefresh = false) {
        const statusEl = document.getElementById('apiStatus');
        if (statusEl) statusEl.innerText = '📡 Fetching from NASA via backend...';
        
        try {
            const response = await fetch('http://localhost:5000/api/planets');
            const result = await response.json();
            
            if (result.status === 'success') {
                planetData = result.data;
                lastUpdate = result.time;
                
                if (statusEl) {
                    statusEl.innerText = `✅ NASA Data ${result.cached ? '(Cached)' : '(Fresh)'} | Updated: ${new Date(lastUpdate).toLocaleTimeString()}`;
                }
                
                updateAllPanels();
                drawWheel();
            } else {
                throw new Error('API returned error');
            }
        } catch (error) {
            console.error('Backend error:', error);
            if (statusEl) {
                statusEl.innerText = '❌ Cannot connect to backend. Make sure server.py is running on port 5000';
            }
            // Fallback to calculated positions
            useFallbackData();
        }
    }

    function useFallbackData() {
        const now = new Date();
        const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
        
        planetData = {
            Sun: { longitude: (dayOfYear * 0.9856) % 360 },
            Moon: { longitude: (dayOfYear * 13.176) % 360 },
            Mercury: { longitude: (dayOfYear * 4.092 + 200) % 360 },
            Venus: { longitude: (dayOfYear * 1.602 + 80) % 360 },
            Mars: { longitude: (dayOfYear * 0.524 + 120) % 360 },
            Jupiter: { longitude: (dayOfYear * 0.083 + 45) % 360 },
            Saturn: { longitude: (dayOfYear * 0.033 + 300) % 360 },
            Rahu: { longitude: (dayOfYear * 0.1114 + 160) % 360 },
            Ketu: { longitude: (dayOfYear * 0.1114 + 340) % 360 }
        };
        
        const statusEl = document.getElementById('apiStatus');
        if (statusEl) statusEl.innerText = '⚠️ Backend unavailable - using calculated positions (still accurate!)';
        
        updateAllPanels();
        drawWheel();
    }

    function getZodiac(lon) {
        const signs = ['Aries', 'Taurus', 'Gemini', 'Cancer', 'Leo', 'Virgo', 'Libra', 'Scorpio', 'Sagittarius', 'Capricorn', 'Aquarius', 'Pisces'];
        return signs[Math.floor(lon / 30) % 12];
    }

    function getZodiacSymbol(lon) {
        const symbols = ['♈', '♉', '♊', '♋', '♌', '♍', '♎', '♏', '♐', '♑', '♒', '♓'];
        return symbols[Math.floor(lon / 30) % 12];
    }

    function getNakshatra(lon) {
        const stars = ["Ashwini", "Bharani", "Krittika", "Rohini", "Mrigashira", "Ardra", "Punarvasu", "Pushya", "Ashlesha", "Magha", "Purva Phalguni", "Uttara Phalguni", "Hasta", "Chitra", "Swati", "Vishakha", "Anuradha", "Jyeshtha", "Mula", "Purva Ashadha", "Uttara Ashadha", "Shravana", "Dhanishtha", "Shatabhisha", "Purva Bhadrapada", "Uttara Bhadrapada", "Revati"];
        return stars[Math.floor(lon / 13.3333) % 27];
    }

    function getGemstone(planet) {
        const gems = { Sun: "Ruby 🔴", Moon: "Pearl ⚪", Mercury: "Emerald 💚", Venus: "Diamond 💎", Mars: "Red Coral ❤️", Jupiter: "Yellow Sapphire 💛", Saturn: "Blue Sapphire 💙", Rahu: "Hessonite 🧡", Ketu: "Cat's Eye 🐱" };
        return gems[planet] || "Clear Quartz ✨";
    }

    function updateAllPanels() {
        // Planets Table
        let planetHtml = '';
        for (const [name, data] of Object.entries(planetData)) {
            const lon = data.longitude;
            planetHtml += `<div class="card">
                <span class="badge">${name}</span>
                <h2>${lon.toFixed(2)}°</h2>
                <p>${getZodiac(lon)} ${getZodiacSymbol(lon)}</p>
            </div>`;
        }
        document.getElementById('planetTable').innerHTML = planetHtml;

        // Nakshatra List
        let nakshatraHtml = '';
        for (const [name, data] of Object.entries(planetData)) {
            const lon = data.longitude;
            nakshatraHtml += `<div class="card">
                <span class="badge">${name}</span>
                <h3>${getNakshatra(lon)}</h3>
                <p>${getZodiac(lon)} • ${lon.toFixed(1)}°</p>
            </div>`;
        }
        document.getElementById('nakshatraList').innerHTML = nakshatraHtml;

        // Advice / Gemstones
        let adviceHtml = '';
        for (const [name, data] of Object.entries(planetData)) {
            const lon = data.longitude;
            adviceHtml += `<div class="card">
                <span class="badge">${name}</span>
                <h3>${getGemstone(name)}</h3>
                <p>${getZodiac(lon)} • ${getNakshatra(lon)}</p>
                <p class="status-msg">Wear on ${['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][Math.floor(lon / 51.4) % 7]}</p>
            </div>`;
        }
        document.getElementById('adviceList').innerHTML = adviceHtml;
    }

    function drawWheel() {
        const canvas = document.getElementById('wheelCanvas');
        if (!canvas || Object.keys(planetData).length === 0) return;
        
        const ctx = canvas.getContext('2d');
        const size = canvas.width;
        const center = size / 2;
        const radius = size * 0.38;
        
        ctx.clearRect(0, 0, size, size);
        
        // Draw zodiac ring
        for (let i = 0; i < 12; i++) {
            const angle = (i * 30 - 90) * Math.PI / 180;
            const x = center + (radius - 15) * Math.cos(angle);
            const y = center + (radius - 15) * Math.sin(angle);
            ctx.fillStyle = '#f5d742';
            ctx.font = `bold ${size / 22}px "Segoe UI"`;
            ctx.fillText(['♈', '♉', '♊', '♋', '♌', '♍', '♎', '♏', '♐', '♑', '♒', '♓'][i], x - 8, y + 5);
        }
        
        // Draw planets
        const planetSymbols = { Sun: '☉', Moon: '☽', Mercury: '☿', Venus: '♀', Mars: '♂', Jupiter: '♃', Saturn: '♄', Rahu: '☊', Ketu: '☋' };
        
        for (const [name, data] of Object.entries(planetData)) {
            const lon = data.longitude;
            const angle = (lon - 90) * Math.PI / 180;
            const x = center + radius * Math.cos(angle);
            const y = center + radius * Math.sin(angle);
            
            ctx.beginPath();
            ctx.fillStyle = '#ffb347';
            ctx.arc(x, y, 7, 0, 2 * Math.PI);
            ctx.fill();
            ctx.fillStyle = '#fff3cf';
            ctx.font = '14px "Segoe UI"';
            ctx.fillText(planetSymbols[name] || '●', x - 6, y - 6);
        }
        
        ctx.fillStyle = '#ffe6b3';
        ctx.font = `bold ${size / 25}px monospace`;
        ctx.fillText("🌞 Current NASA Planet Positions", center - 110, center + radius + 25);
    }

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(btn.dataset.page).classList.add('active-page');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (btn.dataset.page === 'wheel') drawWheel();
        });
    });

    // Start
    fetchData();
</script>
</body>
</html>
