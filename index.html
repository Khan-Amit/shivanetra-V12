<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shivanetra V12 – MARDUKH SYSTEM™</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 30% 20%, #0a0f1e, #020408);
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .landing-container, .app-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .landing-card {
            max-width: 550px;
            margin: 60px auto;
            background: rgba(10, 14, 23, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            padding: 2.5rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 0 2px #d4af37 inset;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f9e0a0, #c9a52c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #b9a46b;
            margin-bottom: 2rem;
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            color: #e5cb7a;
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid #d4af37;
            background: #1a1f2e;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .row-3, .row-2 {
            display: flex;
            gap: 10px;
        }
        .row-3 select, .row-2 select {
            flex: 1;
        }

        .enter-btn {
            background: linear-gradient(135deg, #d4af37, #b8912e);
            color: #0a0c16;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 14px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            width: 100%;
            margin-top: 1.5rem;
        }

        .enter-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .app-container {
            display: none;
        }

        .header-bar {
            background: rgba(0,0,0,0.5);
            border-radius: 1rem;
            padding: 12px 20px;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid #d4af37;
        }

        .user-info {
            color: #e5cb7a;
        }

        .change-btn {
            background: #2a3a2e;
            border: 1px solid #b5934b;
            color: #ffeaac;
            padding: 6px 15px;
            border-radius: 30px;
            cursor: pointer;
        }

        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .page-btn {
            background: #1c2635;
            border: none;
            color: #ecdcaa;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
        }

        .page-btn.active {
            background: #d4af37;
            color: #0a0c16;
        }

        .chart-container {
            background: #03060cb3;
            border-radius: 1.5rem;
            padding: 1.5rem;
            text-align: center;
            color: white;
        }

        .planet-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            color: #f0f2f5;
        }

        .planet-table th, .planet-table td {
            padding: 10px;
            border-bottom: 1px solid #2e3a48;
            text-align: left;
        }

        .planet-table th {
            color: #e9cf86;
        }

        .info-card {
            background: #1a1f2e;
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.7rem;
            color: #6c757d;
        }

        .error-message {
            background: rgba(255,0,0,0.2);
            border: 1px solid #ff4444;
            border-radius: 12px;
            padding: 12px;
            margin-top: 1rem;
            color: #ff8888;
            display: none;
        }

        .success-message {
            background: rgba(0,255,0,0.2);
            border: 1px solid #44ff44;
            border-radius: 12px;
            padding: 12px;
            margin-top: 1rem;
            color: #88ff88;
            display: none;
        }
    </style>
</head>
<body>

<!-- LANDING PAGE -->
<div id="landingPage" class="landing-container">
    <div class="landing-card">
        <div class="logo">⚡ MARDUKH SYSTEM™ ⚡</div>
        <div class="subtitle">Shivanetra V12 · Data-Driven Natal Astrology</div>

        <div class="form-group">
            <label>🌟 Full Name</label>
            <input type="text" id="userName" placeholder="Enter your full name" value="Seliim Ahmed">
        </div>

        <div class="form-group">
            <label>🎂 Birth Date</label>
            <div class="row-3">
                <select id="birthDay">
                    <option value="">Day</option>
                    <option value="27" selected>27</option>
                    <script>for(let i=1;i<=31;i++) if(i!==27) document.write(`<option value="${i}">${i}</option>`);</script>
                </select>
                <select id="birthMonth">
                    <option value="">Month</option>
                    <option value="5" selected>May</option>
                    <option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option>
                    <option value="4">Apr</option><option value="5">May</option><option value="6">Jun</option>
                    <option value="7">Jul</option><option value="8">Aug</option><option value="9">Sep</option>
                    <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
                </select>
                <select id="birthYear">
                    <option value="">Year</option>
                    <option value="1960" selected>1960</option>
                    <script>for(let i=1950;i<=2026;i++) if(i!==1960) document.write(`<option value="${i}">${i}</option>`);</script>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>⏰ Birth Time (24hr)</label>
            <div class="row-2">
                <select id="birthHour">
                    <option value="">Hour</option>
                    <option value="5" selected>05</option>
                    <script>for(let i=0;i<=23;i++) if(i!==5) document.write(`<option value="${i}">${i.toString().padStart(2,'0')}</option>`);</script>
                </select>
                <select id="birthMinute">
                    <option value="">Minute</option>
                    <option value="30" selected>30</option>
                    <script>for(let i=0;i<=59;i++) if(i!==30) document.write(`<option value="${i}">${i.toString().padStart(2,'0')}</option>`);</script>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>📍 Birth Location</label>
            <input type="text" id="birthLocation" placeholder="City, Country" value="Dhaka, Bangladesh">
        </div>

        <div class="form-group">
            <label>🌍 Coordinates (Optional)</label>
            <div class="row-2">
                <input type="text" id="latitude" placeholder="Latitude" value="23.8103">
                <input type="text" id="longitude" placeholder="Longitude" value="90.4125">
            </div>
        </div>

        <button class="enter-btn" id="enterBtn">🔮 GENERATE MY CHART</button>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <footer>© MARDUKH SYSTEM™ — Sovereign Proprietary License | Seliim Ahmed</footer>
    </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="app-container">
    <div class="header-bar">
        <span class="user-info" id="displayUser">—</span>
        <button class="change-btn" id="changeUserBtn">🔄 New User</button>
    </div>

    <div class="nav-bar" id="navBar">
        <button class="page-btn active" data-page="1">🌀 NATAL CHART</button>
        <button class="page-btn" data-page="2">📊 PLANETS</button>
        <button class="page-btn" data-page="3">✨ NAKSHATRA</button>
        <button class="page-btn" data-page="4">🔢 NUMEROLOGY</button>
    </div>

    <div id="pageContent" class="chart-container">
        <div class="loading"></div> Loading chart data...
    </div>

    <footer>© MARDUKH SYSTEM™ — Data-Driven | Real Planetary Calculations</footer>
</div>

<script>
    let currentChartData = null;
    let currentPage = 1;
    
    // Auto-fill coordinates for Dhaka
    const cityCoords = {
        'dhaka': { lat: 23.8103, lon: 90.4125 },
        'new york': { lat: 40.7128, lon: -74.0060 },
        'london': { lat: 51.5074, lon: -0.1278 },
        'delhi': { lat: 28.6139, lon: 77.2090 },
        'mumbai': { lat: 19.0760, lon: 72.8777 },
        'kolkata': { lat: 22.5726, lon: 88.3639 }
    };
    
    document.getElementById('birthLocation').addEventListener('blur', function() {
        const location = this.value.toLowerCase();
        for (const [city, coords] of Object.entries(cityCoords)) {
            if (location.includes(city)) {
                document.getElementById('latitude').value = coords.lat;
                document.getElementById('longitude').value = coords.lon;
                break;
            }
        }
    });
    
    async function calculateChart() {
        const btn = document.getElementById('enterBtn');
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        
        // Get values
        const name = document.getElementById('userName').value.trim();
        const day = document.getElementById('birthDay').value;
        const month = document.getElementById('birthMonth').value;
        const year = document.getElementById('birthYear').value;
        const hour = document.getElementById('birthHour').value;
        const minute = document.getElementById('birthMinute').value;
        const location = document.getElementById('birthLocation').value.trim();
        let lat = document.getElementById('latitude').value;
        let lon = document.getElementById('longitude').value;
        
        // Clear messages
        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';
        
        // Validation with detailed messages
        if (!name) {
            errorDiv.innerHTML = '❌ Please enter your name';
            errorDiv.style.display = 'block';
            return;
        }
        if (!day) {
            errorDiv.innerHTML = '❌ Please select birth day';
            errorDiv.style.display = 'block';
            return;
        }
        if (!month) {
            errorDiv.innerHTML = '❌ Please select birth month';
            errorDiv.style.display = 'block';
            return;
        }
        if (!year) {
            errorDiv.innerHTML = '❌ Please select birth year';
            errorDiv.style.display = 'block';
            return;
        }
        if (!hour) {
            errorDiv.innerHTML = '❌ Please select birth hour';
            errorDiv.style.display = 'block';
            return;
        }
        if (!minute) {
            errorDiv.innerHTML = '❌ Please select birth minute';
            errorDiv.style.display = 'block';
            return;
        }
        if (!location) {
            errorDiv.innerHTML = '❌ Please enter birth location';
            errorDiv.style.display = 'block';
            return;
        }
        
        // Auto coordinates if not provided
        if (!lat || !lon) {
            const locLower = location.toLowerCase();
            let found = false;
            for (const [city, coords] of Object.entries(cityCoords)) {
                if (locLower.includes(city)) {
                    lat = coords.lat;
                    lon = coords.lon;
                    found = true;
                    break;
                }
            }
            if (!found) {
                lat = 23.8103;
                lon = 90.4125;
            }
        }
        
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span> Calculating your chart...';
        
        const userData = {
            name: name,
            birthDate: `${year}-${month}-${day}`,
            birthTime: `${hour.toString().padStart(2,'0')}:${minute.toString().padStart(2,'0')}:00`,
            latitude: parseFloat(lat),
            longitude: parseFloat(lon),
            location: location,
            timezoneOffset: 6, // Dhaka GMT+6
            gender: 'M'
        };
        
        console.log('Sending data:', userData);
        
        try {
            const response = await fetch('/api/chart/calculate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData)
            });
            
            const result = await response.json();
            console.log('Response:', result);
            
            if (result.success) {
                currentChartData = result;
                localStorage.setItem('shivanetra_chart_data', JSON.stringify(result));
                localStorage.setItem('shivanetra_user_input', JSON.stringify(userData));
                
                document.getElementById('landingPage').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                document.getElementById('displayUser').innerHTML = `${result.user.name} | ${result.user.birthDate} | ${result.user.location}`;
                
                renderPage();
            } else {
                errorDiv.innerHTML = `❌ Error: ${result.error || 'Calculation failed'}`;
                errorDiv.style.display = 'block';
            }
        } catch (err) {
            console.error('Fetch error:', err);
            errorDiv.innerHTML = `❌ Network Error: ${err.message}. Make sure server is running on port 3000.`;
            errorDiv.style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.innerHTML = '🔮 GENERATE MY CHART';
        }
    }
    
    function renderPage() {
        const content = document.getElementById('pageContent');
        if (!currentChartData) return;
        
        const chart = currentChartData.chart;
        const num = currentChartData.numerology;
        
        if (currentPage === 1) {
            content.innerHTML = `
                <h2 style="color:#e5cb7a;">🌀 NATAL CHART</h2>
                <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin-top:1rem;">
                    <div class="info-card"><strong>⭐ Ascendant</strong><br>${chart.ascendant.toFixed(2)}°<br>${chart.ascendantSign}</div>
                    <div class="info-card"><strong>☉ Sun Sign</strong><br>${chart.sunSign}</div>
                    <div class="info-card"><strong>🌙 Moon Nakshatra</strong><br>${chart.nakshatra ? chart.nakshatra.name : 'Unknown'}</div>
                    <div class="info-card"><strong>📅 Calculated</strong><br>${new Date(chart.calculatedAt).toLocaleString()}</div>
                </div>
                <h3 style="color:#e5cb7a; margin-top:1.5rem;">🏠 House Cusps</h3>
                <div style="display:grid; grid-template-columns:repeat(6,1fr); gap:0.5rem; margin-top:0.5rem;">
                    ${chart.houses.map((h, i) => `<div style="background:#1a1f2e; padding:8px; border-radius:8px; text-align:center;"><strong>H${i+1}</strong><br>${h.toFixed(1)}°</div>`).join('')}
                </div>
            `;
        } else if (currentPage === 2) {
            content.innerHTML = `
                <h2 style="color:#e5cb7a;">📊 PLANETARY POSITIONS</h2>
                <table class="planet-table">
                    <thead><tr><th>Planet</th><th>Longitude</th><th>Zodiac</th><th>House</th></tr></thead>
                    <tbody>
                        ${chart.planets.map(p => `
                            <tr>
                                <td>${p.name}</td>
                                <td>${p.longitude.toFixed(2)}°</td>
                                <td>${p.zodiacSign}</td>
                                <td>House ${p.house}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        } else if (currentPage === 3) {
            const nak = chart.nakshatra;
            content.innerHTML = `
                <h2 style="color:#e5cb7a;">✨ NAKSHATRA (Lunar Mansion)</h2>
                ${nak ? `
                    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin-top:1rem;">
                        <div class="info-card"><strong>🌟 Nakshatra</strong><br>${nak.name}</div>
                        <div class="info-card"><strong>👑 Ruling Planet</strong><br>${nak.lord}</div>
                        <div class="info-card"><strong>📐 Pada</strong><br>${nak.pada || 1}</div>
                        <div class="info-card"><strong>🎯 Range</strong><br>${nak.start.toFixed(1)}° - ${nak.end.toFixed(1)}°</div>
                    </div>
                ` : '<p>Nakshatra data unavailable</p>'}
            `;
        } else if (currentPage === 4) {
            content.innerHTML = `
                <h2 style="color:#e5cb7a;">🔢 NUMEROLOGY REPORT</h2>
                <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:1rem; margin-top:1rem;">
                    <div class="info-card"><strong>📖 Life Path</strong><br>${num.western.lifePathNumber}</div>
                    <div class="info-card"><strong>💖 Soul Urge</strong><br>${num.western.soulUrgeNumber}</div>
                    <div class="info-card"><strong>🕉️ Kabbalah</strong><br>${num.kabbalah.number} - ${num.kabbalah.sphere}</div>
                    <div class="info-card"><strong>🐉 Chinese Zodiac</strong><br>${num.chinese.zodiac} (${num.chinese.element}, ${num.chinese.yinYang})</div>
                    <div class="info-card"><strong>🧘 Kua Number</strong><br>${num.chinese.kua.number}</div>
                    <div class="info-card"><strong>🌌 Kundalini</strong><br>Soul:${num.kundalini.soul} Karma:${num.kundalini.karma} Destiny:${num.kundalini.destiny}</div>
                </div>
            `;
        }
    }
    
    document.getElementById('enterBtn').addEventListener('click', calculateChart);
    
    document.getElementById('changeUserBtn').addEventListener('click', () => {
        document.getElementById('landingPage').style.display = 'block';
        document.getElementById('mainApp').style.display = 'none';
        currentChartData = null;
    });
    
    document.querySelectorAll('.page-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            currentPage = parseInt(btn.dataset.page);
            document.querySelectorAll('.page-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderPage();
        });
    });
    
    // Check for saved data
    const savedData = localStorage.getItem('shivanetra_chart_data');
    if (savedData) {
        try {
            currentChartData = JSON.parse(savedData);
            const savedUser = localStorage.getItem('shivanetra_user_input');
            if (savedUser) {
                const userInput = JSON.parse(savedUser);
                document.getElementById('landingPage').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                document.getElementById('displayUser').innerHTML = `${userInput.name} | ${userInput.birthDate} | ${userInput.location}`;
                renderPage();
            }
        } catch(e) {}
    }
</script>
</body>
</html>
